# Local development infrastructure for the backend (apps/api).
# The pgvector image ships Postgres 18 with the vector extension preinstalled,
# which the API enables via a migration.
#
#   docker compose -f infra/docker-compose.yml up -d
#
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: vacation_db
    environment:
      POSTGRES_USER: vacation
      POSTGRES_PASSWORD: vacation
      POSTGRES_DB: vacation
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images expect the mount at /var/lib/postgresql (data lives
      # in a version-specific subdir), NOT the older /var/lib/postgresql/data.
      - vacation_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacation -d vacation"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vacation_pgdata:
