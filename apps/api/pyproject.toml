[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.2",
    "django-anymail[resend]>=11",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.28",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Django auto-generates migrations; don't lint machine-written code.
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
# DJ001: our nullable URL fields mirror the app's schema, where "no image" is a
# genuine NULL rather than an empty string. Keeping null=True is deliberate.
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
# Tests run against the SAME database engine as production: Postgres 18 +
# pgvector (the infra/docker-compose.yml container). Django creates a throwaway
# `test_vacation` DB there and runs every migration into it, so pgvector and all
# constraints are exercised exactly as in prod — never SQLite or an in-memory DB.
# --reuse-db keeps that test DB between runs for speed; use `pytest --create-db`
# (pnpm test:api:fresh) to rebuild it after a schema change.
addopts = "--reuse-db"
